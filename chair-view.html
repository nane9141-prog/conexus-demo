<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONEXUS · 의장용 화면</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Pretendard',system-ui,sans-serif;background:#0A0A0A;color:#E5E5E5;display:flex;overflow:hidden}
  .contents{flex:1;display:flex;flex-direction:column;padding:48px;gap:16px;min-width:0}
  .cv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cv-title{flex:1;text-align:center;font-size:24px;font-weight:700;color:#E5E5E5;letter-spacing:-.01em}
  .cv-tools{display:flex;align-items:center;gap:8px}
  .cv-ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.15);cursor:pointer;color:#FAFAFA}
  .cv-ib.plain{background:none;border:none}
  .cv-ib:hover{background:rgba(255,255,255,.1)}
  .cv-ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cv-script{flex:1;display:flex;align-items:center;justify-content:center;text-align:left}
  .cv-script p{font-size:32px;font-weight:700;line-height:1.62;letter-spacing:-.01em;color:#0071F3;max-width:100%}
  /* 우측 대기열 */
  .cv-side{width:400px;flex:none;background:#171717;border-left:1px solid rgba(255,255,255,.1);padding:16px;display:flex;flex-direction:column;gap:16px}
  .cv-qh{display:flex;align-items:center;gap:10px;padding-left:2px;color:#A3A3A3;font-size:16px;font-weight:500}
  .cv-qh svg{width:22px;height:22px;fill:none;stroke:#A3A3A3;stroke-width:1.6}
  .cv-agenda{display:flex;flex-direction:column;gap:8px;overflow:auto}
  .cv-arow{display:flex;align-items:center;gap:12px;padding:8px;background:#171717;border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;transition:.15s}
  .cv-arow:hover{background:rgba(255,255,255,.04)}
  .cv-arow.on{border-color:#0071F3;background:rgba(0,113,243,.12)}
  .cv-no{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(0deg,rgba(10,10,10,.7),rgba(10,10,10,.7)),#A3A3A3;font-size:14px;font-weight:500;color:#E5E5E5}
  .cv-arow.on .cv-no{background:#0071F3;color:#fff}
  .cv-atitle{flex:1;font-size:16px;font-weight:500;color:#E5E5E5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
  <div class="contents">
    <div class="cv-top">
      <span style="width:96px"></span>
      <div class="cv-title" id="cvTitle">개회 선언</div>
      <div class="cv-tools">
        <button class="cv-ib" id="cvMinus" title="글자 작게"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="cv-ib" id="cvPlus" title="글자 크게"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="cv-ib plain" id="cvPrev" title="이전"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="cv-ib plain" id="cvNext" title="다음"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="cv-script"><p id="cvScript">지금부터 제10기 정기주주총회를 시작하겠습니다.</p></div>
  </div>
  <div class="cv-side">
    <div class="cv-qh"><svg viewBox="0 0 24 24"><path d="M16 4h5M16 9h5M16 14h5"/><circle cx="7" cy="8" r="3"/><path d="M2 19a5 5 0 0 1 10 0"/></svg><span id="cvQueue">발언 대기열 8명</span></div>
    <div class="cv-agenda" id="cvAgenda"></div>
  </div>

<script>
(function(){
  var SLIDES=[
    {t:'개회 선언', s:'지금부터 제10기 정기주주총회를 시작하겠습니다. 의결권 있는 주식 총수의 과반이 참석하여 성원이 되었으므로, 본 총회의 개회를 선언합니다.'},
    {t:'제1호 재무제표 승인의 건', s:'제1호 재무제표 승인의 건을 상정합니다. 본 의안은 지난 한 해 동안의 경영 실적을 정리한 재무상태표 및 손익계산서를 승인받고자 하는 것입니다. 표결에 앞서 본 안건에 대해 질문이나 의견이 있으신 주주께서는 발언 신청 버튼을 눌러 주시기 바랍니다. 신청해 주신 주주님께 순서대로 발언권을 부여해 드리겠으며, 발언이 끝난 후 표결을 진행하겠습니다.'},
    {t:'제2호 정관 일부 변경의 건', s:'제2호 정관 일부 변경의 건을 상정합니다. 전자주주총회 도입 및 의결권 대리행사 수단 확대를 위한 정관 개정안입니다. 세부 조항에 대한 설명 후 표결을 진행하겠습니다.'},
    {t:'제3호 이사 선임의 건', s:'제3호 이사 선임의 건을 상정합니다. 집중투표 방식으로 사외이사 후보 4인 중 2인을 선임합니다. 후보자별 약력은 소집공고 첨부자료를 참고해 주시기 바랍니다.'},
    {t:'폐회 선언', s:'모든 의안에 대한 표결이 종료되었습니다. 주주 여러분의 협조에 감사드리며, 제10기 정기주주총회의 폐회를 선언합니다.'}
  ];
  var AGENDA=[
    {i:1,t:'재무제표 승인의 건',slide:1},
    {i:2,t:'정관 일부 변경의 건',slide:2},
    {i:3,t:'이사 선임의 건',slide:3}
  ];
  var idx=0, fs=32;
  var title=document.getElementById('cvTitle'), script=document.getElementById('cvScript'), pEl=script;
  function render(){
    title.textContent=SLIDES[idx].t;
    script.textContent=SLIDES[idx].s;
    script.style.fontSize=fs+'px';
    document.querySelectorAll('.cv-arow').forEach(function(r){ r.classList.toggle('on', +r.dataset.slide===idx); });
  }
  var ag=document.getElementById('cvAgenda');
  ag.innerHTML=AGENDA.map(function(a){return '<div class="cv-arow" data-slide="'+a.slide+'"><span class="cv-no">'+a.i+'</span><span class="cv-atitle">제'+a.i+'호 '+a.t+'</span></div>';}).join('');
  ag.addEventListener('click',function(e){ var r=e.target.closest('.cv-arow'); if(r){ idx=+r.dataset.slide; render(); } });
  document.getElementById('cvPrev').addEventListener('click',function(){ idx=Math.max(0,idx-1); render(); });
  document.getElementById('cvNext').addEventListener('click',function(){ idx=Math.min(SLIDES.length-1,idx+1); render(); });
  document.getElementById('cvPlus').addEventListener('click',function(){ fs=Math.min(56,fs+2); render(); });
  document.getElementById('cvMinus').addEventListener('click',function(){ fs=Math.max(20,fs-2); render(); });
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')document.getElementById('cvNext').click(); if(e.key==='ArrowLeft')document.getElementById('cvPrev').click(); });
  render();
})();
</script>
</body>
</html>
